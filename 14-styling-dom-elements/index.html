<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styling DOM Elements</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <h1>Styling DOM Elements</h1>

    <section id="section-1">
      <p>
        This button's text gets bigger and its background color changes when you
        click it!
      </p>
      <button id="font-button" class="myButton">Click Me!</button>
    </section>

    <section id="section-2">
      <p id="my-paragraph">Click on of the below buttons to change this text's color</p>
      <button class="myButton" id="add-text-red">Make Text Red</button>
      <button class="myButton" id="remove-text-color">Remove Text Color</button>
      <button class="myButton" id="add-text-blue">Make Text Blue</button>
      <button class="myButton" id="toggle-big-text">Toggle Big Text</button>
    </section>

    <script src="scripts/stylingDomElements.js"></script>
  </body>
</html>
