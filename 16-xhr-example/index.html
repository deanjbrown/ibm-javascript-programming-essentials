<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XHR Request Example</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <h1>XHR Request Example</h1>
    <p>
      This is an example of using XMLHttpRequest (XHR) to make HTTP Requests in
      JavaScript and handle JSON responses
    </p>
    <hr/>

    <section>
      <h2>User data</h2>
      <p>Send a request to the JSONPlaceholder API to fetch user data</p>
      <button id="fetch-user-data-button" class="myButton">Fetch User Data</button>
      <div id="user-data-container"></div>
    </section>

    <hr/>

    <section>
      <h2>Post data</h2>
      <p>Send a request to the JSONPlaceholder API to fetch post data</p>
      <button id="fetch-post-data-button" class="myButton">Fetch Post Data</button>
      <div id="post-data-container"></div>
    </section>

    <hr/>

    <script src="scripts/xhrRequestExample.js"></script>
  </body>
</html>
