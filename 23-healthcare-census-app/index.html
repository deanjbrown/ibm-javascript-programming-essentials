<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare Census</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <nav>
      <h1>Healthcare Census</h1>
      <ul>
        <li><a href="./index.html" id="home">Home </a></li>
        <li><a href="./health_contact.html">Contact Us</a></li>
        <li>
          <input
            type="text"
            id="conditionInput"
            placeholder="Enter a health condition"
          />
        </li>
        <li><button id="searchBtn">Search</button></li>
      </ul>
    </nav>
    <div class="container">
      <div class="analysisForm">
        <h2>Healthcare Data Analysis</h2>
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" />
        </div>
        <div>
          <label>Gender:</label>
          <label for="male">Male</label>
          <input type="radio" name="gender" id="male" value="Male" />
          <label for="female">Female</label>
          <input type="radio" name="gender" id="female" value="Female" />
        </div>
        <div>
          <label for="age">Age:</label>
          <input type="number" id="age" />
        </div>
        <div>
          <label for="condition">Condition</label>
          <select id="condition">
            <option value="">Select Condition</option>
            <option value="diabetes">Diabetes</option>
            <option value="thyroid">Thyroid</option>
            <option value="highBloodPressure">High Blood Pressure</option>
          </select>
        </div>
      </div>
      <button id="addPatient">Add Patient</button>
      <hr/>
      <h2>Analysis Report</h2>
      <div id="report"></div>
      <div class="searchCondition">
        <div id="result"></div>
      </div>
    </div>

    <script src="scripts/healthcareCensus.js"></script>
  </body>
</html>
